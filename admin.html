<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOXNECTAR | Product Admin</title><style>
:root{--bg:#0c0709;--panel:#1b1015;--gold:#e7c18a;--cream:#f7e9d5;--muted:#bba99e;--line:#55303a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px Arial,sans-serif}header{padding:22px max(20px,5vw);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}h1,h2{font-family:Georgia,serif;color:var(--gold);font-weight:normal}h1{margin:0;font-size:27px}a{color:var(--gold)}main{max-width:1150px;margin:30px auto;padding:0 20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:22px}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #694b49;border-radius:6px;background:#100a0d;color:white;font:inherit}input[type=checkbox]{width:auto}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}button{cursor:pointer;background:var(--gold);color:#1b0c0d;border:0;padding:12px 18px;border-radius:6px;font-weight:bold;margin:12px 8px 0 0}button.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}button.danger{background:#5b1d29;color:white}button:disabled{opacity:.5;cursor:not-allowed}.product{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.product img{height:60px;width:60px;object-fit:cover;border-radius:5px}.product .info{flex:1;min-width:0}.muted{color:var(--muted);font-size:13px}.message{min-height:20px;color:var(--gold);margin:12px 0}.hidden{display:none!important}@media(max-width:650px){.cols{grid-template-columns:1fr}.product{flex-wrap:wrap}header{flex-wrap:wrap}}
</style></head><body><header><h1>NOXNECTAR <span style="font-size:14px">/ ADMIN</span></h1><a href="./index.html">View store</a></header><main><p id="message" class="message" role="status"></p><section id="loginPanel" class="panel"><h2>Administrator access</h2><p class="muted">This login is for store management only. Customers never need to sign in.</p><form id="loginForm"><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Unlock dashboard</button></form></section><section id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Manage products</h2><button id="logout" class="secondary">Sign out</button></div><div class="panel"><h2 id="formHeading">Add product</h2><form id="productForm"><div class="cols"><label>Product name<input id="name" required maxlength="100" placeholder="OUD MAJESTY"></label><label>Price (₹)<input id="price" type="number" min="0" step="0.01" required></label><label>Bottle size<input id="size" value="100 ml" maxlength="40"></label><label>Stock quantity<input id="stock" type="number" min="0" step="1" value="10" required></label></div><label>Description<textarea id="description" rows="3" maxlength="500"></textarea></label><label>Product image HTTPS URL<input id="imageUrl" type="url" placeholder="https://example.com/perfume.jpg"></label><label><input id="visible" type="checkbox" checked> Visible on storefront</label><label><input id="inStock" type="checkbox" checked> Available for enquiry</label><button id="save" type="submit">Save product</button><button id="reset" type="button" class="secondary">Clear / Add new</button></form></div><div class="panel"><h2>Products in Firestore</h2><p class="muted">Changes appear on the storefront automatically. Add products here to replace the static starter catalogue.</p><div id="productsList"></div></div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,collection,addDoc,updateDoc,deleteDoc,getDoc,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {firebaseConfig,isConfigured} from './firebase-config.js';
const ADMIN_EMAIL = "admin@noxnectar.in"; // Firebase Authentication account; change if needed
const $=id=>document.getElementById(id);let auth,db,unsubscribe=null,editingId=null,admin=false,products=[];
const notify=msg=>$('message').textContent=msg;
if(!isConfigured()){notify('Setup required: enter your Firebase web app configuration in firebase-config.js');$('loginForm').querySelector('button').disabled=true;}
else{
 const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
 $('loginForm').addEventListener('submit',async e=>{e.preventDefault();notify('Signing in…');try{await signInWithEmailAndPassword(auth,ADMIN_EMAIL,$('password').value);$('password').value='';}catch(err){notify('Sign-in failed: '+err.message)}});
 onAuthStateChanged(auth,async user=>{if(unsubscribe){unsubscribe();unsubscribe=null}admin=false;$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden');if(!user){notify('');return}try{const record=await getDoc(doc(db,'admins',user.uid));if(!record.exists()||record.data().role!=='admin'){notify('Access denied: this account is not an approved administrator.');await signOut(auth);return}admin=true;$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');notify('Signed in as administrator.');unsubscribe=onSnapshot(collection(db,'products'),snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));render()},err=>notify('Cannot read products: '+err.message));}catch(err){notify('Admin verification failed: '+err.message)}});
 $('logout').addEventListener('click',()=>signOut(auth));
 $('reset').addEventListener('click',resetForm);
 $('productForm').addEventListener('submit',async e=>{e.preventDefault();if(!admin)return;const url=$('imageUrl').value.trim();if(url&&!url.startsWith('https://')){notify('Use an HTTPS image URL.');return}const data={name:$('name').value.trim(),price:Number($('price').value),size:$('size').value.trim(),stock:Number($('stock').value),description:$('description').value.trim(),imageUrl:url,visible:$('visible').checked,inStock:$('inStock').checked,updatedAt:serverTimestamp()};$('save').disabled=true;try{if(editingId){await updateDoc(doc(db,'products',editingId),data)}else{await addDoc(collection(db,'products'),data)}notify('Product saved successfully.');resetForm()}catch(err){notify('Save failed: '+err.message)}finally{$('save').disabled=false}});
}
function resetForm(){$('productForm').reset();$('size').value='100 ml';$('stock').value='10';$('visible').checked=true;$('inStock').checked=true;editingId=null;$('formHeading').textContent='Add product';$('save').textContent='Save product'}
function render(){const root=$('productsList');root.replaceChildren();if(!products.length){root.textContent='No products yet. Add your first perfume above.';return}products.forEach(p=>{const row=document.createElement('div');row.className='product';if(p.imageUrl&&p.imageUrl.startsWith('https://')){const img=document.createElement('img');img.src=p.imageUrl;img.alt='';row.append(img)}const info=document.createElement('div');info.className='info';const title=document.createElement('strong');title.textContent=p.name||'Unnamed product';info.append(title);const details=document.createElement('div');details.className='muted';details.textContent=`₹${p.price} · ${p.stock} in stock · ${p.visible===false?'Hidden':'Visible'}`;info.append(details);row.append(info);const edit=document.createElement('button');edit.textContent='Edit';edit.className='secondary';edit.addEventListener('click',()=>{editingId=p.id;['name','price','size','stock','description','imageUrl'].forEach(k=>$(k).value=p[k]??'');$('visible').checked=p.visible!==false;$('inStock').checked=p.inStock!==false;$('formHeading').textContent='Edit product';$('save').textContent='Update product';window.scrollTo({top:0,behavior:'smooth'})});row.append(edit);const del=document.createElement('button');del.textContent='Delete';del.className='danger';del.addEventListener('click',async()=>{if(!confirm('Permanently delete '+(p.name||'this product')+'?'))return;try{await deleteDoc(doc(db,'products',p.id));notify('Product deleted.')}catch(err){notify('Delete failed: '+err.message)}});row.append(del);root.append(row)})}
</script></body></html>
